<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CoffeeShop</h1>
        <nav>
            <a href="#menu">Menu</a>
            <a href="#tentang">Tentang</a>
            <a href="#kontak">Kontak</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Kopi Terbaik di Kota</h2>
        <p>Segarkan harimu dengan kopi pilihan kami.</p>
        <a href="#menu" class="btn">Lihat Menu</a>
    </section>

    <section id="menu">
        <h2>Menu Kami</h2>
        <div class="menu-grid">
            <div class="card">
                <h3>Cappuccino</h3>
                <p>Espresso + susu steamed</p>
                <span>Rp 25.000</span>
            </div>
            <div class="card">
                <h3>Latte</h3>
                <p>Espresso + susu + foam</p>
                <span>Rp 28.000</span>
            </div>
            <div class="card">
                <h3>Americano</h3>
                <p>Espresso + air panas</p>
                <span>Rp 20.000</span>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 CoffeeShop Bari</p>
    </footer>
</body>
</html>
